# Paths are resolved relative to this file unless absolute.
dataset_root: dataset

# A CSV row's target_* value is used when present. This is the fallback.
target_per_class: 200
oversampling_factor: 1.75
min_width: 224
min_height: 224
max_download_bytes: 25000000

# Limits are scoped to one plant/health-label collection run.
max_images_per_query: 80
max_images_per_domain: 30
phash_threshold: 5

request_timeout: 15
search_retries: 3
download_retries: 3
backoff_factor: 1.0
request_delay_seconds: 0.25
download_workers: 8

# Openverse provides source diversity; Commons provides detailed source metadata.
providers:
  - wikimedia

# Set false only when deliberately retrying URLs already recorded as failures.
skip_failed_urls_on_resume: true

# These are conservative review flags, not proof that an image is unsuitable.
# Flagged, decodable images are retained under dataset/rejected/review/.
review_keywords:
  - diagram
  - drawing
  - illustration
  - cartoon
  - infographic
  - chart
  - logo
  - seed packet
  - packaging
  - stock preview
  - generated by ai
  - ai-generated
